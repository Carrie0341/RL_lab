params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0

  model:
    name: continuous_a2c_logstd

  network:
    name: visual_factory_test  # 使用新的簡化測試模型
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    
    # 簡化的視覺處理模塊配置
    visual_encoder:
      type: conv2d
      activation: elu
      initializer:
        name: orthogonal_initializer
        gain: 1.4142
      regularizer:
        name: None
      convs:
        - filters: 32
          kernel_size: 8
          strides: 4
          padding: 2
        - filters: 64
          kernel_size: 4
          strides: 2
          padding: 1
        - filters: 64
          kernel_size: 3
          strides: 1
          padding: 1
    
    # 簡化的動作處理模塊
    action_encoder:
      units: [64, 32]
      activation: elu
      initializer:
        name: orthogonal_initializer
        gain: 1.4142
      regularizer:
        name: None
    
    # 簡化的MLP層
    mlp:
      units: [512, 256, 128]
      activation: elu
      initializer:
        name: orthogonal_initializer
        gain: 1.4142
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ""

  config:
    name: Factory_Multi_Camera  # 修改名稱以區分測試配置
    device: cuda:0
    full_experiment_name: visual_factory_multi_camera_v5_1
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: False
    normalize_value: True
    value_bootstrap: True
    num_actors: 64
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 5.0e-5
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 1500
    save_best_after: 10
    save_frequency: 150
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 128
    mini_epochs: 6
    critic_coef: 2
    clip_value: True
    bounds_loss_coef: 0.0001

    # 簡化的中央價值網絡配置
    central_value_config:
      minibatch_size: 128
      mini_epochs: 6
      learning_rate: 5e-5
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [256, 128]
          activation: elu
          initializer:
            name: orthogonal_initializer
            gain: 1.4142
          regularizer:
            name: None

    player:
      deterministic: False